services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ofek
      POSTGRES_PASSWORD: ofek
      POSTGRES_DB: ofek
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofek -d ofek"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

  deposits:
    build: ./deposits
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://deposits_user:deposits_user@postgres:5432/ofek
      DEPOSITS_PORT: 3002
      KAFKA_BROKERS: kafka:9092
      KAFKA_WAITING_TOPIC: deposits.waiting
      KAFKA_DECISION_TOPIC: deposits.decisions
      KAFKA_DLQ_TOPIC: deposits.dlq
    depends_on:
      postgres:
        condition: service_healthy

  agent:
    build: ./agent
    ports:
      - "3001:3001"
    environment:
      AGENT_PORT: 3001
      AGENT_DATABASE_URL: postgres://agent_reader:agent_reader@postgres:5432/ofek
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy

  desk:
    build: ./desk
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://desk_user:desk_user@postgres:5432/ofek
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: deposits.waiting
      DESK_PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8088:80"
    depends_on:
      - desk
      - agent
      - deposits
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
